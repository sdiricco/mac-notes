name: Release

# Ogni tag "vX.Y.Z" builda l'app su mac/win/linux (x64 + arm64 per ognuno) e
# pubblica una release GitHub con gli artefatti (dmg/zip, nsis, AppImage/deb).
# Vedi package.json > build.publish.
#
# Ogni piattaforma ha un job per architettura: costruire più binari in
# sequenza sullo stesso runner causa flakiness (es. su mac "hdiutil detach" -
# l'immagine disco del primo DMG non si smonta in tempo prima che parta il
# secondo), che fa fallire electron-builder anche dopo aver già caricato
# quasi tutti gli asset.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build e pubblica (mac ${{ matrix.arch }})
        run: npx electron-vite build && npx electron-builder --mac --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build e pubblica (linux ${{ matrix.arch }})
        run: npx electron-vite build && npx electron-builder --linux --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build e pubblica (windows ${{ matrix.arch }})
        run: npx electron-vite build && npx electron-builder --win --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
